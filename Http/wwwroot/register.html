<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>星轨初途 - 注册</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Microsoft YaHei", sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #312e81
            );
        }

        .register-box {
            width: 420px;
            padding: 42px;

            border-radius: 20px;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);

            box-shadow: 0 20px 60px rgba(0,0,0,0.35);

            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .tip {
            text-align: center;

            color: #cbd5e1;

            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid #64748b;
            border-radius: 10px;

            outline: none;

            background: rgba(255,255,255,0.1);

            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .input-box input:focus {
            border-color: #818cf8;
        }

        .register-button {
            width: 100%;
            height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.9;
        }

        .login {
            margin-top: 22px;

            text-align: center;

            color: #cbd5e1;

            font-size: 14px;
        }

        a {
            color: #a5b4fc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .home {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="register-box">

    <h1>✨ 星轨初途</h1>

    <p class="tip">
        创建一个新的账号
    </p>


    <form>

        <div class="input-box">

            <label>用户名</label>

            <input
                type="text"
                placeholder="请输入用户名"
            >

        </div>


        <div class="input-box">

            <label>邮箱</label>

            <input
                type="email"
                placeholder="请输入邮箱"
            >

        </div>


        <div class="input-box">

            <label>密码</label>

            <input
                type="password"
                placeholder="请输入密码"
            >

        </div>


        <div class="input-box">

            <label>确认密码</label>

            <input
                type="password"
                placeholder="请再次输入密码"
            >

        </div>


        <button class="register-button" type="button">
            注册
        </button>

    </form>


    <div class="login">

        已经有账号？

        <a href="Login.html">
            立即登录
        </a>

    </div>


    <div class="home">

        <a href="index.html">
            ← 返回首页
        </a>

    </div>

</div>

</body>
</html>
