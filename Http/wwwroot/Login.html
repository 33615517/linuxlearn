<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>星轨初途 - 登录</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Microsoft YaHei", sans-serif;

            background: linear-gradient(135deg,
                    #0f172a,
                    #1e293b,
                    #312e81);
        }

        .login-box {
            width: 400px;
            padding: 45px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);

            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .tip {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid #64748b;
            border-radius: 10px;

            outline: none;

            background: rgba(255, 255, 255, 0.1);

            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .input-box input:focus {
            border-color: #818cf8;
        }

        .login-button {
            width: 100%;
            height: 46px;

            margin-top: 10px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg,
                    #6366f1,
                    #8b5cf6);

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .register {
            margin-top: 22px;

            text-align: center;

            color: #cbd5e1;
            font-size: 14px;
        }

        a {
            color: #a5b4fc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .home {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>✨ 星轨初途</h1>

        <p class="tip">
            欢迎回来，请登录你的账号
        </p>


        
        <form action="/login" method="POST">

            <div class="input-box">
                <label>用户名</label>

                <input type="text" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="input-box">
                <label>密码</label>

                <input type="password" name="password" placeholder="请输入密码" required>
            </div>

            <button class="login-button" type="submit">
                登录
            </button>

        </form>


        <div class="register">
            还没有账号？
            <a href="register.html">
                立即注册
            </a>
        </div>


        <div class="home">
            <a href="index.html">
                ← 返回首页
            </a>
        </div>

    </div>

</body>

</html>
